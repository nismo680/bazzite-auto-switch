[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sessionflipper"
version = "0.1.0.dev0"
description = "Automatic Desktop ↔ Console session switching for systems using steamos-session-select."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "nismo680" }
]

dependencies = [
    "pyudev>=0.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "types-PyYAML",
]

[project.scripts]
sessionflipper = "sessionflipper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sessionflipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sessionflipper"]

[[tool.mypy.overrides]]
module = ["pyudev"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
